# ==============================================================================
# JobPortal AI — Base Application Properties (Production-Ready)
# ==============================================================================
spring.application.name=JOBPORTAL_BACKEND
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# -- Server & Network Performance --
server.port=${PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Embedded Tomcat Resource Constraints (Tuned for 512MB Container)
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:20}
server.tomcat.threads.min-spare=${TOMCAT_MIN_SPARE_THREADS:3}
server.tomcat.accept-count=50
server.tomcat.max-connections=100
server.tomcat.max-swallow-size=2MB

# HTTP Response Compression (Gzip)
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
server.compression.min-response-size=1024

# Error Handling (Suppresses internal stack traces from attackers)
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# -- PostgreSQL Database Configuration --
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/jobportal}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:12345678}
spring.datasource.driver-class-name=org.postgresql.Driver

# -- HikariCP Connection Pool (Tuned for Render Free 512MB + Supabase free tier) --
# max=3: conserves memory (~1MB overhead/conn) and stays well within Supabase's 60-conn cap.
# min=1: pool never fully drops to 0, avoiding reconnect penalty on first request after idle.
# idleTimeout=600s / maxLifetime=1800s: Supabase terminates idle connections after ~10min.
# keepalive=60s: sends a lightweight ping every minute to prevent Supabase from dropping idle conns.
spring.datasource.hikari.pool-name=JobPortalHikariPool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:3}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.leak-detection-threshold=15000

# -- JPA / Hibernate Configuration --
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.default_batch_fetch_size=20
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# -- Multipart File Uploads (Capped for Memory Safety) --
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
file.upload.base-dir=${FILE_UPLOAD_DIR:uploads}

# -- Pagination Defaults --
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=50

# -- Brevo Transactional Email Service (Direct HTTPS REST API) --
brevo.api-key=${BREVO_API_KEY:}
brevo.sender.email=${MAIL_FROM:namijojo5687@gmail.com}
brevo.sender.name=${MAIL_FROM_NAME:JobPortal AI}
app.mail.from-email=${brevo.sender.email}
app.mail.from-name=${brevo.sender.name}

# -- Spring AI - Groq (OpenAI-compatible protocol) --
spring.ai.openai.api-key=${AI_API_KEY:${GROQ_API_KEY:}}
spring.ai.openai.base-url=${AI_BASE_URL:https://api.groq.com/openai/v1}
spring.ai.openai.chat.options.model=${AI_MODEL:openai/gpt-oss-120b}
spring.ai.openai.chat.options.temperature=0.0

# -- JWT Security Configuration --
jwt.secret=${JWT_SECRET:velora_jobportal_super_secret_key_2026_change_in_production_xyz}
jwt.expiration.ms=${JWT_EXPIRATION_MS:28800000}

# -- Auth Cookie Configuration --
auth.cookie-name=access_token
auth.cookie-secure=${COOKIE_SECURE:false}
auth.cookie-same-site=${COOKIE_SAME_SITE:Lax}
auth.cookie-path=/
auth.cookie-max-age=28800
auth.cookie-domain=${COOKIE_DOMAIN:}

# -- CORS & Admin Bootstrap --
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://localhost:5174,https://*.vercel.app,https://job-portal-frontend-rho-nine.vercel.app}
app.admin.bootstrap.enabled=${ADMIN_BOOTSTRAP_ENABLED:true}
app.admin.bootstrap.name=${ADMIN_BOOTSTRAP_NAME:Platform Admin}
app.admin.bootstrap.email=${ADMIN_BOOTSTRAP_EMAIL:yashlodam03@gmail.com}
app.admin.bootstrap.password=${ADMIN_BOOTSTRAP_PASSWORD:YashLodam@2004}

# -- Async & Task Execution (Bounded for Low-Memory Container) --
async.core-pool-size=${ASYNC_CORE_POOL_SIZE:2}
async.max-pool-size=${ASYNC_MAX_POOL_SIZE:4}
async.queue-capacity=${ASYNC_QUEUE_CAPACITY:100}
async.thread-name-prefix=jobportal-async-

# -- Maintenance & Startup Optimization Flags --
app.schema.cleaner.enabled=${APP_SCHEMA_CLEANER_ENABLED:false}
app.migration.fix-foreign-keys.enabled=${FIX_FOREIGN_KEYS_ENABLED:false}
