<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#DB2777" />
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Rounded Square Shield Container -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" />
  <!-- Inner Glow Accent -->
  <rect x="40" y="40" width="432" height="432" rx="104" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="8" />
  <!-- Sparkles Icon -->
  <g filter="url(#glow)">
    <!-- Main Center Sparkle Star -->
    <path fill="url(#starGrad)" d="M256 112c12 72 64 124 136 136-72 12-124 64-136 136-12-72-64-124-136-136 72-12 124-64 136-136z" />
    <!-- Secondary Top-Right Sparkle -->
    <path fill="#FDE68A" d="M376 96c6 36 32 62 68 68-36 6-62 32-68 68-6-36-32-62-68-68 36-6 62-32 68-68z" />
  </g>
</svg>